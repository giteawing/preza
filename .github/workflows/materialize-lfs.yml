name: Materialize presentation LFS source

on:
  push:
    branches:
      - arena/01a091de-preza
    paths:
      - .github/workflows/materialize-lfs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify source
        run: |
          test "$(stat -c %s 'СВК_10_принципов_управления_дизайн.pptx')" -eq 195678257
          echo '652cd345e15310fdbec7ad246c4c78e05fe561ce53e2e942955707f25143087b  СВК_10_принципов_управления_дизайн.pptx' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-source
          path: СВК_10_принципов_управления_дизайн.pptx
          compression-level: 0
          retention-days: 1
